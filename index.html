<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Victor Gabriel — Currículo jogável</title>
    <meta name="description" content="Currículo interativo em 3D: ande pelo meu planeta e descubra minha trajetória." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: ui-monospace, "Cascadia Mono", Consolas, "Lucida Console", "Courier New", monospace; font-weight: 700; color: #fff; text-rendering: optimizeLegibility; }
      canvas { display: block; touch-action: none; image-rendering: pixelated; }
      #nome { position: fixed; left: 18px; top: 14px; font-size: 16px; letter-spacing: .5px; pointer-events: none; text-shadow: 2px 0 #070a1a, -2px 0 #070a1a, 0 2px #070a1a, 0 -2px #070a1a, 2px 2px #070a1a, -2px -2px #070a1a, 2px -2px #070a1a, -2px 2px #070a1a; }
      #pontos { position: fixed; right: 18px; top: 18px; display: flex; gap: 10px; pointer-events: none; }
      #pontos i { width: 12px; height: 12px; border-radius: 0; box-shadow: 0 0 0 2px #070a1a; background: var(--c); opacity: .3; transition: opacity .25s, transform .25s; }
      #pontos i.on { opacity: 1; transform: scale(1.5); }
      #dica { position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 15px; color: #e6e8ff; padding: 0 16px; pointer-events: none; transition: opacity .6s; text-shadow: 2px 0 #070a1a, -2px 0 #070a1a, 0 2px #070a1a, 0 -2px #070a1a, 2px 2px #070a1a, -2px -2px #070a1a, 2px -2px #070a1a, -2px 2px #070a1a; }
      #dica.some { opacity: 0; }
      #fichas-hud { position: fixed; right: 18px; top: 42px; display: flex; align-items: center; gap: 8px; font-size: 17px; pointer-events: none;
        text-shadow: 2px 0 #070a1a, -2px 0 #070a1a, 0 2px #070a1a, 0 -2px #070a1a, 2px 2px #070a1a, -2px -2px #070a1a, 2px -2px #070a1a, -2px 2px #070a1a; }
      #fichas-hud b { color: #ffd23f; }
      .popup { position: fixed; z-index: 5; transform: translate(-50%, -100%); font-size: 20px; color: #ffd23f; pointer-events: none; animation: popup-sobe 1s steps(10) forwards;
        text-shadow: 2px 0 #070a1a, -2px 0 #070a1a, 0 2px #070a1a, 0 -2px #070a1a, 2px 2px #070a1a, -2px -2px #070a1a, 2px -2px #070a1a, -2px 2px #070a1a; }
      @keyframes popup-sobe { to { transform: translate(-50%, calc(-100% - 46px)); opacity: 0; } }
      #painel { position: fixed; left: 50%; bottom: 46px; width: min(640px, calc(100vw - 28px)); box-sizing: border-box; transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
        background: #12173a; border: 4px solid var(--c, #7c5cff); border-radius: 0; padding: 14px 20px 16px; box-shadow: 0 0 0 4px #070a1a, 6px 6px 0 4px rgba(0, 0, 0, .5);
        transition: opacity .25s, transform .25s; }
      #painel.on { opacity: 1; transform: translate(-50%, 0); }
      /* tela larga: o painel fica na lateral, sem cobrir o planeta nem o personagem */
      @media (min-width: 900px) {
        #painel { left: 36px; bottom: auto; top: 50%; width: 400px; max-height: calc(100vh - 90px); transform: translate(-14px, -50%); }
        #painel.on { transform: translate(0, -50%); }
      }
      #painel h2 { margin: 0 0 10px; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--c, #fff); }
      #painel p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; color: #f0f1ff; }
      #painel button { pointer-events: none; margin-top: 12px; font: inherit; font-size: 15px; letter-spacing: 1px; color: #fff; background: var(--c, #7c5cff); border: 4px solid #070a1a; padding: 8px 14px; cursor: pointer; box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.2); }
      #painel button[hidden] { display: none; }
      #painel.on button { pointer-events: auto; }
      #rotulos { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
      .rotulo { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity .2s; will-change: transform;
        text-shadow: 2px 0 #070a1a, -2px 0 #070a1a, 0 2px #070a1a, 0 -2px #070a1a, 2px 2px #070a1a, -2px -2px #070a1a, 2px -2px #070a1a, -2px 2px #070a1a; }
      #painel.on { pointer-events: auto; }
      #painel { max-height: min(72vh, calc(100vh - 110px)); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--c, #7c5cff) #0b1026; }
      #painel p { font-size: 14px; line-height: 1.5; }
      #painel p.destaque { font-size: 16px; line-height: 1.4; color: #fff; border-left: 4px solid var(--c); padding-left: 10px; }
      #painel p.dica { font-size: 12px; color: #9fa8e0; }
      #painel .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin: 0 0 12px; }
      #painel .num { background: #1b2252; border: 2px solid #2a3470; padding: 6px 6px; text-align: center; }
      #painel .num b { display: block; font-size: 20px; color: var(--c); }
      #painel .num span { font-size: 11px; color: #aab3e8; }
      #painel .etiquetas { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 12px; }
      #painel .etq { font-size: 12px; padding: 2px 7px; background: #1b2252; border: 2px solid #323d86; color: #dfe4ff; }
      #painel .grupo { margin: 0 0 6px; }
      #painel .grupo h3 { margin: 0 0 5px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--c); }
      #painel .grupo .etiquetas { margin-bottom: 6px; }
      #painel details.cartao { margin: 0 0 8px; background: #171d47; border-left: 4px solid #3a4496; }
      #painel details.cartao.atual { border-left-color: #58e08a; }
      #painel details.cartao[open] { border-left-color: var(--c); background: #1b2252; }
      #painel summary { position: relative; list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 7px 9px 7px 22px; }
      #painel summary::-webkit-details-marker { display: none; }
      #painel summary::before { content: '▸'; position: absolute; left: 8px; top: 7px; color: var(--c); font-size: 13px; }
      #painel details[open] > summary::before { content: '▾'; }
      #painel summary:hover { background: rgba(255, 255, 255, .05); }
      #painel summary .tit b { display: block; font-size: 14px; color: #fff; }
      #painel summary .tit i { font-style: normal; font-size: 12px; color: #9fa8e0; }
      #painel summary .per { font-size: 11px; color: #aab3e8; text-align: right; }
      #painel details.atual summary .per { color: #58e08a; }
      #painel .corpo { padding: 0 9px 9px 22px; }
      #painel .corpo p { font-size: 13px; line-height: 1.45; margin: 0 0 8px; color: #e0e4ff; }
      #painel .corpo .etiquetas { margin-bottom: 4px; }
      #painel .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      #painel a.btn { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; background: var(--c); color: #fff; text-decoration: none; border: 3px solid #070a1a; font-size: 13px; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .3), inset 2px 2px 0 rgba(255, 255, 255, .2); }
      #painel a.btn:hover { filter: brightness(1.15); }
      #painel .contatos { display: flex; flex-direction: column; gap: 6px; }
      #painel .contato { display: flex; gap: 6px; align-items: stretch; }
      #painel .contato .ln { flex: 1; display: flex; align-items: center; gap: 10px; padding: 6px 9px; background: #171d47; border-left: 4px solid var(--c); color: #fff; text-decoration: none; min-width: 0; }
      #painel .contato .ln:hover { background: #212a66; }
      #painel .ln .ic { font-size: 18px; color: var(--c); width: 20px; text-align: center; }
      #painel .ln small { display: block; font-size: 11px; color: #9fa8e0; text-transform: uppercase; letter-spacing: 1px; }
      #painel .ln b { font-size: 14px; overflow-wrap: anywhere; }
      #painel button.copiar { margin: 0; font: inherit; font-size: 11px; padding: 0 9px; background: #2a3470; color: #fff; border: 3px solid #070a1a; cursor: pointer; box-shadow: none; }
      #painel button.copiar:hover { background: #38449a; }
      #painel .rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 9px; border-top: 2px dashed #2a3470; font-size: 11px; color: #9fa8e0; }
      #painel .pts { display: inline-flex; gap: 3px; margin-right: 7px; vertical-align: middle; }
      #painel .pts i { width: 8px; height: 8px; background: #2a3470; display: inline-block; }
      #painel .pts i.vis { background: var(--c); }
      #painel .prox { color: var(--c); letter-spacing: 1px; }
      #painel a.prox.fim { text-decoration: none; color: #fff; background: var(--c); padding: 3px 8px; }
      #painel { z-index: 3; }
      #rotulos { z-index: 2; }
      #painel button#acao:not([hidden]) { display: block; }
      #pontos i.vis { opacity: .65; }
      #som { position: fixed; right: 18px; top: 70px; font: inherit; font-size: 12px; letter-spacing: 1px; color: #fff; background: #2a3470; border: 3px solid #070a1a; padding: 3px 8px; cursor: pointer; z-index: 2;
        box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .3), inset 2px 2px 0 rgba(255, 255, 255, .18); }
      #som:hover { background: #38449a; }
      #som.mudo { opacity: .6; text-decoration: line-through; }
      #creditos { position: fixed; right: 12px; bottom: 7px; z-index: 1; font-size: 11px; color: #aab3e8; text-shadow: 1px 1px 0 #070a1a, -1px -1px 0 #070a1a, 1px -1px 0 #070a1a, -1px 1px 0 #070a1a; }
      #creditos a { color: #fff; }
    </style>
    <script type="module" crossorigin src="./assets/index-DwLCnmBU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CuRIN88X.css">
  </head>
  <body>
    <div id="nome"></div>
    <div id="pontos"></div>
    <div id="fichas-hud" title="Suas fichas do cassino"><i class="moeda"></i><b>0</b></div>
    <div id="painel"><h2></h2><div id="texto"></div><button id="acao" hidden>JOGAR [E]</button></div>
    <button id="som" title="Ligar ou desligar o som e a música">♪ SOM</button>
    <div id="dica">← ↑ ↓ → (ou WASD) para andar pelo planeta · SHIFT corre · ESPAÇO pula · no celular, arraste o dedo</div>
    <div id="creditos">♪ Todas as músicas foram criadas no <a href="https://www.beepbox.co" target="_blank" rel="noopener noreferrer">BeepBox</a></div>
  </body>
</html>
